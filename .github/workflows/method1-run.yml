name: Build Docker Image (Run Commands)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-method1:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js (Frontend Build)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies and Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
        cd ..

    - name: Build Docker Image
      run: |
        docker build -t haroonijaz123/bse7_02:method1 -f Dockerfile .

    - name: Verify Docker Image
      run: |
        docker images