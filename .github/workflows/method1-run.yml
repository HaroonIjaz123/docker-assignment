name: Build Docker Image (Run Commands)

on:
  push:
    branches: [ "main", "master" ] # Ya jo bhi aapki default branch ho

jobs:
  build-method1:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t cityhospital-method1:latest .

    - name: Verify Docker Image
      run: |
        echo "Verifying local images:"
        docker images
        echo "Method 1 build verified successfully!"